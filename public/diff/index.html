      spacerFor:"a"
    });
  }
}

function layoutWordWeights(text){
  const words=
    text.match(
      /[\p{L}\p{N}_]+/gu
    ) || [];

  const result=
    new Map();

  for(const word of words){
    const key=
      normalizedLayoutWord(word);

    const weight=
      layoutTokenWeight({
        text:word
      });

    result.set(
      key,
      Math.max(
        result.get(key) || 0,
        weight
      )
    );
  }

  return result;
}

function totalLayoutInformation(weights){
  let total=0;

  for(const value of weights.values()){
    total+=value;
  }

  return total;
}

function weightedLayoutDice(a,b){
  const totalA=
    totalLayoutInformation(a);

  const totalB=
    totalLayoutInformation(b);

  if(!totalA && !totalB){
    return 0;
  }

  if(!totalA || !totalB){
    return 0;
  }

  let common=0;

  const small=
    a.size<=b.size
      ? a
      : b;

  const large=
    a.size<=b.size
      ? b
      : a;

  for(const [key,weight] of small){
    if(large.has(key)){
      common+=Math.min(
        weight,
        large.get(key)
      );
    }
  }

  return (
    2*common/
    (totalA+totalB)
  );
}

function localLineSimilarity(
  lineA,
  lineB
){
  const a=
    lineA.text;

  const b=
    lineB.text;

  const wordsA=
    layoutWordWeights(a);

  const wordsB=
    layoutWordWeights(b);

  const informationA=
    totalLayoutInformation(
      wordsA
    );

  const informationB=
    totalLayoutInformation(
      wordsB
    );

  // A blank line, punctuation-only line, or line made only from tiny
  // service words is formatting, not a positional anchor.
  if(
    informationA<1.10 ||
    informationB<1.10
  ){
    return 0;
  }

  const lexical=
    weightedLayoutDice(
      wordsA,
      wordsB
    );

  // Character similarity is useful only after we have proved that both
  // lines contain real lexical material. It cannot make a newline strong.
  const chars=
    charSimilarity(
      a,
      b
    );

  if(a===b){
    return 1;
  }

  return Math.max(
    lexical,
    chars*.62
  );
}

function findLocalLineAnchors(
  linesA,
  linesB,
  aStart,
  aEnd,
  bStart,
  bEnd
){
  const candidates=[];

  for(let a=aStart;a<aEnd;a++){
    for(let b=bStart;b<bEnd;b++){
      const similarity=
        localLineSimilarity(
          linesA[a],
          linesB[b]
        );

      // Case 6: clearly modified, but still recognisably the same line.
      if(similarity<.58){
        continue;
      }

      const relativeA=
        (a-aStart)/
        Math.max(
          1,
          aEnd-aStart-1
        );

      const relativeB=
        (b-bStart)/
        Math.max(
          1,
          bEnd-bStart-1
        );

      candidates.push({
        a,
        b,
        // Similarity dominates; proximity is a small ambiguity tie-breaker.
        weight:
          similarity*100-
          Math.abs(
            relativeA-relativeB
          )*.05
      });
    }
  }

  if(!candidates.length){
    return [];
  }

  return weightedLisTokenAnchors(
    candidates,
    linesB.length+1
  );
}

function appendGapRows(
  rows,
  linesA,
  linesB,
  aStart,
  aEnd,
  bStart,
  bEnd
){
  if(
    aStart>=aEnd &&
    bStart>=bEnd
  ){
    return;
  }

  const localAnchors=
    findLocalLineAnchors(
      linesA,
      linesB,
      aStart,
      aEnd,
      bStart,
      bEnd
    );

  if(!localAnchors.length){
    // Case 7 fallback: unmatched right-side blocks stay as high as possible.
    appendTopAlignedRows(
      rows,
      aStart,
      aEnd,
      bStart,
      bEnd,
      "unmatched"
    );

    return;
  }

  let cursorA=aStart;
  let cursorB=bStart;

  for(const anchor of localAnchors){
    if(
      anchor.a<cursorA ||
      anchor.b<cursorB
    ){
      continue;
    }

    appendTopAlignedRows(
      rows,
      cursorA,
      anchor.a,
      cursorB,
      anchor.b,
      "unmatched"
    );

    rows.push({
      aIndex:anchor.a,
      bIndex:anchor.b,
      layoutKind:"similar"
    });

    cursorA=anchor.a+1;
    cursorB=anchor.b+1;
  }

  appendTopAlignedRows(
    rows,
    cursorA,
    aEnd,
    cursorB,
    bEnd,
    "unmatched"
  );
}

function appendMatchedBlockRows(
  rows,
  block
){
  const countA=
    Math.max(
      0,
      block.aEnd-block.aStart
    );

  const countB=
    Math.max(
      0,
      block.bEnd-block.bStart
    );

  const paired=
    Math.min(
      countA,
      countB
    );

  for(let offset=0;offset<paired;offset++){
    rows.push({
      aIndex:block.aStart+offset,
      bIndex:block.bStart+offset,
      layoutKind:"match",
      alignmentBlock:block,
      blockOffset:offset
    });
  }

  for(let offset=paired;offset<countA;offset++){
    rows.push({
      aIndex:block.aStart+offset,
      bIndex:null,
      bInsert:block.bStart+paired,
      layoutKind:"match",
      alignmentBlock:block,
      blockOffset:offset,
      spacerFor:"b"
    });
  }

  for(let offset=paired;offset<countB;offset++){
    rows.push({
      aIndex:null,
      bIndex:block.bStart+offset,
      aInsert:block.aStart+paired,
      layoutKind:"match",
      alignmentBlock:block,
      blockOffset:offset,
      spacerFor:"a"
    });
  }
}

function annotateLineLayoutRows(rows){
  let aCursor=0;
  let bCursor=0;

  for(const row of rows){
    row.aInsert=aCursor;
    row.bInsert=bCursor;

    if(row.aIndex!=null){
      aCursor=row.aIndex+1;
    }

    if(row.bIndex!=null){
      bCursor=row.bIndex+1;
    }
  }

  return rows;
}

function fallbackLineLayout(linesA,linesB){
  const rows=[];
  const count=Math.max(
    linesA.length,
    linesB.length
  );

  for(let index=0;index<count;index++){
    rows.push({
      aIndex:index<linesA.length
        ? index
        : null,
      bIndex:index<linesB.length
        ? index
        : null
    });
  }

  return annotateLineLayoutRows(rows);
}

function buildLineLayout(
  parts,
  textA,
  textB
){
  const linesA=
    physicalLines(textA);

  const linesB=
    physicalLines(textB);

  if(algorithmMode==="lines"){
    const lineRows=
      buildLineRows(
        linesA.map(
          line=>line.text
        ),
        linesB.map(
          line=>line.text
        )
      );

    return {
      linesA,
      linesB,
      rows:lineRows.map(row=>({
        aIndex:row.aIndex,
        bIndex:row.bIndex,
        aInsert:row.aInsert,
        bInsert:row.bInsert
      }))
    };
  }

  const blocks=
    buildCanonicalAlignmentBlocks(
      textA,
      textB
    );

  const rows=[];

  let cursorA=0;
  let cursorB=0;

  for(const block of blocks){
    if(
      block.aStart<cursorA ||
      block.bStart<cursorB
    ){
      continue;
    }

    // Everything before the next recognised block follows rules 2/3/6/7.
    appendGapRows(
      rows,
      linesA,
      linesB,
      cursorA,
      block.aStart,
      cursorB,
      block.bStart
    );

    appendMatchedBlockRows(
      rows,
      block
    );

    cursorA=block.aEnd;
    cursorB=block.bEnd;
  }

  // Case 8: before/after known blocks is just ordinary empty-space padding.
  appendGapRows(
    rows,
    linesA,
    linesB,
    cursorA,
    linesA.length,
    cursorB,
    linesB.length
  );

  return {
    linesA,
    linesB,
    rows:
      annotateLineLayoutRows(
        rows
      )
  };
}

function sideRange(part,side){
  return side==="a"
    ? [part.aStart,part.aEnd]
    : [part.bStart,part.bEnd];
}

function partTouchesRange(
  part,
  side,
  start,
  fullEnd
){
  const [partStart,partEnd]=
    sideRange(part,side);

  if(partStart===partEnd){
    return (
      start<=partStart &&
      partStart<=fullEnd
    );
  }

  return (
    partEnd>start &&
    partStart<fullEnd
  );
}

function visualStrongClass(side){
  return side==="a"
    ? "del"
    : "add";
}

function visualBridgeText(text){
  return (
    text.length<=8 &&
    /^[\s.,!?;:()[\]{}"'«»„“”—–…\-]*$/u.test(text)
  );
}

function coalesceVisualSegments(
  input,
  side
){
  const strong=
    visualStrongClass(side);

  const segments=
    input.map(segment=>({
      ...segment
    }));

  // Bridge only tiny neutral separators. This turns:
  // red + space/punctuation + red
  // into one red interval, without swallowing real unchanged words.
  for(
    let index=1;
    index<segments.length-1;
    index++
  ){
    const current=
      segments[index];

    const previous=
      segments[index-1];

    const next=
      segments[index+1];

    if(
      current.className==null &&
      previous.className &&
      next.className &&
      visualBridgeText(
        current.text
      )
    ){
      current.className=
        previous.className===strong ||
        next.className===strong
          ? strong
          : "soft";
    }
  }

  const merged=[];

  for(const segment of segments){
    const previous=
      merged[merged.length-1];

    if(
      previous &&
      previous.className &&
      segment.className
    ){
      // Any adjacent changed fragments are one visual interval.
      previous.text+=segment.text;

      if(
        previous.className===strong ||
        segment.className===strong
      ){
        previous.className=strong;
      }else{
        previous.className="soft";
      }

      continue;
    }

    if(
      previous &&
      previous.className===
      segment.className
    ){
      previous.text+=segment.text;
      continue;
    }

    merged.push({
      ...segment
    });
  }

  return merged;
}

function renderLineSegments(
  side,
  line,
  parts
){
  if(!line){
    return "<br>";
  }

  const text=state[side];
  const segments=[];

  for(const part of parts){
    const [partStart,partEnd]=
      sideRange(
        part,
        side
      );

    const from=Math.max(
      line.start,
      partStart
    );

    const to=Math.min(
      line.end,
      partEnd
    );

    if(to<=from){
      continue;
    }

    segments.push({
      text:text.slice(
        from,
        to
      ),
      className:partClass(
        part,
        side
      )
    });
  }

  if(
    !segments.length &&
    line.end>line.start
  ){
    segments.push({
      text:text.slice(
        line.start,
        line.end
      ),
      className:null
    });
  }

  const merged=
    coalesceVisualSegments(
      segments,
      side
    );

  let html=
    merged.map(segment=>
      segment.className
        ? `<mark class="${segment.className}">${esc(segment.text)}</mark>`
        : esc(segment.text)
    ).join("");

  if(line.hasNewline){
    const newlineStart=
      line.end;

    const newlineEnd=
      line.end+1;

    const newlinePart=
      parts.find(part=>{
        const [start,end]=
          sideRange(
            part,
            side
          );

        return (
          start<=newlineStart &&
          newlineEnd<=end
        );
      });

    if(newlinePart){
      const className=
        partClass(
          newlinePart,
          side
        );

      if(className){
        html+=
          `<span class="newline-marker ${className}" aria-hidden="true"></span>`;
      }
    }
  }

  return html || "<br>";
}

function boundaryOffsetForLine(
  lines,
  text,
  index
){
  if(index<=0){
    return 0;
  }

  if(index>=lines.length){
    return text.length;
  }

  return lines[index].start;
}

function lineHasChange(
  line,
  side,
  parts
){
  if(!line){
    return false;
  }

  return parts.some(part=>
    part.op!=="equal" &&
    partTouchesRange(
      part,
      side,
      line.start,
      line.fullEnd
    )
  );
}

function hunkTouchesLayoutRow(
  hunk,
  row,
  linesA,
  linesB
){
  const lineA=
    row.aIndex==null
      ? null
      : linesA[row.aIndex];

  const lineB=
    row.bIndex==null
      ? null
      : linesB[row.bIndex];

  const touchesA=
    lineA &&
    (
      hunk.aStart===hunk.aEnd
        ? (
            lineA.start<=hunk.aStart &&
            hunk.aStart<=lineA.fullEnd
          )
        : (
            hunk.aEnd>lineA.start &&
            hunk.aStart<lineA.fullEnd
          )
    );

  const touchesB=
    lineB &&
    (
      hunk.bStart===hunk.bEnd
        ? (
            lineB.start<=hunk.bStart &&
            hunk.bStart<=lineB.fullEnd
          )
        : (
            hunk.bEnd>lineB.start &&
            hunk.bStart<lineB.fullEnd
          )
    );

  if(touchesA || touchesB){
    return true;
  }

  // A pure insertion/deletion may sit exactly in the empty side of
  // a virtual alignment row.
  if(!lineA && row.aInsert!=null){
    const at=boundaryOffsetForLine(
      linesA,
      state.a,
      row.aInsert
    );

    if(
      hunk.aStart===hunk.aEnd &&
      hunk.aStart===at
    ){
      return true;
    }
  }

  if(!lineB && row.bInsert!=null){
    const at=boundaryOffsetForLine(
      linesB,
      state.b,
      row.bInsert
    );

    if(
      hunk.bStart===hunk.bEnd &&
      hunk.bStart===at
    ){
      return true;
    }
  }

  return false;
}

function combineChangeHunks(hunks){
  if(!hunks.length){
    return null;
  }

  const sorted=[...hunks].sort(
    (x,y)=>
      x.aStart-y.aStart ||
      x.bStart-y.bStart
  );

  return {
    type:"change",
    aStart:Math.min(
      ...sorted.map(hunk=>hunk.aStart)
    ),
    aEnd:Math.max(
      ...sorted.map(hunk=>hunk.aEnd)
    ),
    bStart:Math.min(
      ...sorted.map(hunk=>hunk.bStart)
    ),
    bEnd:Math.max(
      ...sorted.map(hunk=>hunk.bEnd)
    ),
    parts:sorted.flatMap(
      hunk=>hunk.parts
    )
  };
}


function makeLineAction(
  sourceSide,
  sourceStart,
  sourceCount,
  targetSide,
  targetStart,
  targetCount,
  description
){
  return {
    sourceSide,
    sourceStart,
    sourceCount,
    targetSide,
    targetStart,
    targetCount,
    description
  };
}

function documentLinesForApply(side){
  // split("\n") preserves a trailing empty physical line, which is important
  // for line-level operations on documents ending with a newline.
  return state[side].split("\n");
}

function clampLineIndex(
  lines,
  index
){
  return Math.max(
    0,
    Math.min(
      index,
      lines.length
    )
  );
}

function applyLineAction(action){
  cancelScheduledRender();

  if(
    !action ||
    !canWrite(action.targetSide)
  ){
    return;
  }

  const before=snapshot();

  const sourceLines=
    documentLinesForApply(
      action.sourceSide
    );

  const targetLines=
    documentLinesForApply(
      action.targetSide
    );

  const sourceStart=
    clampLineIndex(
      sourceLines,
      action.sourceStart
    );

  const targetStart=
    clampLineIndex(
      targetLines,
      action.targetStart
    );

  const sourceCount=
    Math.max(
      0,
      Math.min(
        action.sourceCount,
        sourceLines.length-sourceStart
      )
    );

  const targetCount=
    Math.max(
      0,
      Math.min(
        action.targetCount,
        targetLines.length-targetStart
      )
    );

  const replacement=
    sourceCount
      ? sourceLines.slice(
          sourceStart,
          sourceStart+sourceCount
        )
      : [];

  targetLines.splice(
    targetStart,
    targetCount,
    ...replacement
  );

  // Deleting the only physical line produces the canonical empty document.
  const nextText=
    targetLines.length
      ? targetLines.join("\n")
      : "";

  state[action.targetSide]=
    nextText;

  pushUndo(before);
  syncEditors(false);
  render();
}

function ordinaryRowActions(row){
  const hasA=
    row.aIndex!=null;

  const hasB=
    row.bIndex!=null;

  if(hasA && hasB){
    return {
      toRight:makeLineAction(
        "a",
        row.aIndex,
        1,
        "b",
        row.bIndex,
        1,
        "Заменить строку справа строкой слева"
      ),
      toLeft:makeLineAction(
        "b",
        row.bIndex,
        1,
        "a",
        row.aIndex,
        1,
        "Заменить строку слева строкой справа"
      )
    };
  }

  if(hasA){
    return {
      toRight:makeLineAction(
        "a",
        row.aIndex,
        1,
        "b",
        row.bInsert ?? 0,
        0,
        "Вставить строку слева в правый текст"
      ),
      toLeft:makeLineAction(
        "b",
        row.bInsert ?? 0,
        0,
        "a",
        row.aIndex,
        1,
        "Удалить строку слева"
      )
    };
  }

  if(hasB){
    return {
      toRight:makeLineAction(
        "a",
        row.aInsert ?? 0,
        0,
        "b",
        row.bIndex,
        1,
        "Удалить строку справа"
      ),
      toLeft:makeLineAction(
        "b",
        row.bIndex,
        1,
        "a",
        row.aInsert ?? 0,
        0,
        "Вставить строку справа в левый текст"
      )
    };
  }

  return {
    toRight:null,
    toLeft:null
  };
}

function matchedBlockRowActions(row){
  const block=
    row.alignmentBlock;

  if(!block){
    return ordinaryRowActions(row);
  }

  const countA=
    block.aEnd-block.aStart;

  const countB=
    block.bEnd-block.bStart;

  // Ordinary N:M blocks are deliberately reduced to physical line actions.
  if(
    countA!==1 &&
    countB!==1
  ){
    return ordinaryRowActions(row);
  }

  // 1 <-> 1 is the normal per-line replace case.
  if(
    countA===1 &&
    countB===1
  ){
    return ordinaryRowActions(row);
  }

  // Case 4: one A line corresponds to several B lines.
  if(
    countA===1 &&
    countB>1
  ){
    if(row.aIndex!=null){
      // Single A action replaces the complete B block.
      // B1 still has its own independent B1 -> A1 action.
      return {
        toRight:makeLineAction(
          "a",
          block.aStart,
          1,
          "b",
          block.bStart,
          countB,
          `Заменить ${countB} строк справа одной строкой слева`
        ),
        toLeft:makeLineAction(
          "b",
          row.bIndex,
          1,
          "a",
          block.aStart,
          1,
          "Заменить строку слева этой строкой справа"
        )
      };
    }

    // B2..BN: each right-side line can be inserted into A independently.
    // There is no "empty -> B" delete button here: A1 -> whole B block is
    // already represented by the single group action above.
    return {
      toRight:null,
      toLeft:makeLineAction(
        "b",
        row.bIndex,
        1,
        "a",
        block.aEnd,
        0,
        "Вставить эту строку справа после связанной строки слева"
      )
    };
  }

  // Case 5: several A lines correspond to one B line.
  if(
    countA>1 &&
    countB===1
  ){
    if(row.bIndex!=null){
      // A1 has its own A1 -> B1 action; the single B action replaces
      // the complete A block.
      return {
        toRight:makeLineAction(
          "a",
          row.aIndex,
          1,
          "b",
          block.bStart,
          1,
          "Заменить строку справа этой строкой слева"
        ),
        toLeft:makeLineAction(
          "b",
          block.bStart,
          1,
          "a",
          block.aStart,
          countA,
          `Заменить ${countA} строк слева одной строкой справа`
        )
      };
    }

    // A2..AN: each left-side line can be inserted into B independently.
    return {
      toRight:makeLineAction(
        "a",
        row.aIndex,
        1,
        "b",
        block.bEnd,
        0,
        "Вставить эту строку слева после связанной строки справа"
      ),
      toLeft:null
    };
  }

  return ordinaryRowActions(row);
}

function actionsForLayoutRow(
  row,
  lineA,
  lineB,
  changedA,
  changedB
){
  // A truly identical physical line has nothing to apply.
  if(
    lineA &&
    lineB &&
    lineA.fullText===lineB.fullText &&
    !changedA &&
    !changedB
  ){
    return {
      toRight:null,
      toLeft:null
    };
  }

  return matchedBlockRowActions(
    row
  );
}

function makeLineLayoutRow(
  row,
  linesA,
  linesB,
  parts,
  rowActions=null
){
  const element=
    document.createElement("div");

  element.className="diff-row";

  const lineA=
    row.aIndex==null
      ? null
      : linesA[row.aIndex];

  const lineB=
    row.bIndex==null
      ? null
      : linesB[row.bIndex];

  const left=
    document.createElement("div");

  left.className="side left";
  left.dataset.side="a";

  const leftStart=
    lineA
      ? lineA.start
      : boundaryOffsetForLine(
          linesA,
          state.a,
          row.aInsert ?? 0
        );

  const leftEnd=
    lineA
      ? lineA.end
      : leftStart;

  left.dataset.start=
    String(leftStart);

  left.dataset.end=
    String(leftEnd);

  left.dataset.realLine=
    lineA ? "1" : "0";

  if(lineA){
    left.dataset.lineIndex=
      String(lineA.index);
  }

  left.innerHTML=
    renderLineSegments(
      "a",
      lineA,
      parts
    );

  const right=
    document.createElement("div");

  right.className="side right";
  right.dataset.side="b";

  const rightStart=
    lineB
      ? lineB.start
      : boundaryOffsetForLine(
          linesB,
          state.b,
          row.bInsert ?? 0
        );

  const rightEnd=
    lineB
      ? lineB.end
      : rightStart;

  right.dataset.start=
    String(rightStart);

  right.dataset.end=
    String(rightEnd);

  right.dataset.realLine=
    lineB ? "1" : "0";

  if(lineB){
    right.dataset.lineIndex=
      String(lineB.index);
  }

  right.innerHTML=
    renderLineSegments(
      "b",
      lineB,
      parts
    );

  if(!lineA){
    left.classList.add("empty");
  }

  if(!lineB){
    right.classList.add("empty");
  }

  const changedA=
    lineHasChange(
      lineA,
      "a",
      parts
    );

  const changedB=
    lineHasChange(
      lineB,
      "b",
      parts
    );

  if(changedA){
    left.classList.add(
      "changed-left"
    );
  }

  if(changedB){
    right.classList.add(
      "changed-right"
    );
  }

  const gutter=
    document.createElement("div");

  gutter.className="gutter";

  const leftNumber=
    document.createElement("div");

  leftNumber.className="gnum left";
  leftNumber.textContent=
    lineA
      ? String(lineA.index+1)
      : "";

  const actions=
    document.createElement("div");

  actions.className="row-actions";

  const actionsForRow=
    rowActions || {
      toRight:null,
      toLeft:null
    };

  if(actionsForRow.toRight){
    const toRight=
      document.createElement("button");

    toRight.className="apply-btn";
    toRight.type="button";
    toRight.textContent="»";
    toRight.title=
      actionsForRow.toRight.description ||
      "Применить строку слева направо";
    toRight.disabled=!canWrite("b");
    toRight.addEventListener(
      "pointerdown",
      event=>event.preventDefault()
    );
    toRight.onclick=
      ()=>applyLineAction(
        actionsForRow.toRight
      );

    actions.append(
      toRight
    );
  }

  if(actionsForRow.toLeft){
    const toLeft=
      document.createElement("button");

    toLeft.className="apply-btn";
    toLeft.type="button";
    toLeft.textContent="«";
    toLeft.title=
      actionsForRow.toLeft.description ||
      "Применить строку справа налево";
    toLeft.disabled=!canWrite("a");
    toLeft.addEventListener(
      "pointerdown",
      event=>event.preventDefault()
    );
    toLeft.onclick=
      ()=>applyLineAction(
        actionsForRow.toLeft
      );

    actions.append(
      toLeft
    );
  }

  const rightNumber=
    document.createElement("div");

  rightNumber.className="gnum right";
  rightNumber.textContent=
    lineB
      ? String(lineB.index+1)
      : "";

  gutter.append(
    leftNumber,
    actions,
    rightNumber
  );

  element.append(
    left,
    gutter,
    right
  );

  element.dataset.equal=
    (
      lineA &&
      lineB &&
      lineA.fullText===lineB.fullText &&
      !changedA &&
      !changedB
    )
      ? "1"
      : "0";

  return element;
}

function lineFoldKey(rows,start,end){
  return [
    "line-layout",
    rows[start]?.aIndex ?? "x",
    rows[start]?.bIndex ?? "x",
    rows[end-1]?.aIndex ?? "x",
    rows[end-1]?.bIndex ?? "x",
    end-start
  ].join(":");
}

function makeLineFold(
  hiddenCount,
  key
){
  const fold=
    document.createElement("div");

  fold.className="fold";

  const left=
    document.createElement("div");

  left.className="fold-side";

  const center=
    document.createElement("div");

  center.className="fold-center";
  center.textContent=
    `… ${hiddenCount} одинаковых строк скрыто · показать ещё 5 …`;

  center.onclick=event=>{
    event.preventDefault();
    event.stopPropagation();

    foldReveal.set(
      key,
      (foldReveal.get(key) || 0)+5
    );

    render();
  };

  const right=
    document.createElement("div");

  right.className="fold-side";

  fold.append(
    left,
    center,
    right
  );

  return fold;
}

function renderLineBoundDiff(
  diff,
  parts,
  hunks
){
  const layout=
    buildLineLayout(
      parts,
      state.a,
      state.b
    );

  const {
    linesA,
    linesB,
    rows
  }=layout;

  const rowMeta=rows.map(row=>{
    const lineA=
      row.aIndex==null
        ? null
        : linesA[row.aIndex];

    const lineB=
      row.bIndex==null
        ? null
        : linesB[row.bIndex];

    const changedA=
      lineHasChange(
        lineA,
        "a",
        parts
      );

    const changedB=
      lineHasChange(
        lineB,
        "b",
        parts
      );

    const equal=
      !!(
        lineA &&
        lineB &&
        lineA.fullText===lineB.fullText &&
        !changedA &&
        !changedB
      );

    return {
      row,
      lineA,
      lineB,
      changedA,
      changedB,
      equal,
      actions:actionsForLayoutRow(
        row,
        lineA,
        lineB,
        changedA,
        changedB
      )
    };
  });

  let index=0;
  let equalLines=0;
  let changedRows=0;

  while(index<rowMeta.length){
    if(
      collapsed &&
      rowMeta[index].equal
    ){
      let end=index;

      while(
        end<rowMeta.length &&
        rowMeta[end].equal
      ){
        end++;
      }

      const count=end-index;

      if(count>6){
        const key=
          lineFoldKey(
            rows,
            index,
            end
          );

        const hiddenTotal=count-4;

        const revealed=Math.min(
          foldReveal.get(key) || 0,
          hiddenTotal
        );

        const headEnd=Math.min(
          end-2,
          index+2+revealed
        );

        for(
          let pos=index;
          pos<headEnd;
          pos++
        ){
          const meta=
            rowMeta[pos];

          diff.appendChild(
            makeLineLayoutRow(
              meta.row,
              linesA,
              linesB,
              parts,
              meta.actions
            )
          );

          equalLines++;
        }

        const hidden=
          end-2-headEnd;

        if(hidden>0){
          diff.appendChild(
            makeLineFold(
              hidden,
              key
            )
          );
        }

        for(
          let pos=Math.max(
            headEnd,
            end-2
          );
          pos<end;
          pos++
        ){
          const meta=
            rowMeta[pos];

          diff.appendChild(
            makeLineLayoutRow(
              meta.row,
              linesA,
              linesB,
              parts,
              meta.actions
            )
          );

          equalLines++;
        }

        index=end;
        continue;
      }
    }

    const meta=
      rowMeta[index++];

    diff.appendChild(
      makeLineLayoutRow(
        meta.row,
        linesA,
        linesB,
        parts,
        meta.actions
      )
    );

    if(meta.equal){
      equalLines++;
    }else{
      changedRows++;
    }
  }

  return {
    equalLines,
    changedRows
  };
}

function render(){
  cancelScheduledRender();
  renderDirty=false;
  layoutDirty=false;

  const stage=$("#diffStage");
  const scrollTop=stage.scrollTop;
  const scrollLeft=stage.scrollLeft;

  const parts=
    buildEditParts(
      state.a,
      state.b,
      algorithmMode
    );

  const hunks=
    buildHunks(
      parts,
      state.a
    );

  const diff=$("#diff");
  diff.innerHTML="";

  const stats=
    renderLineBoundDiff(
      diff,
      parts,
      hunks
    );

  $("#stats").textContent=
    `Одинаковых строк: ${stats.equalLines} · Строк с изменениями: ${stats.changedRows}`;

  $("#toggleFold").classList.toggle(
    "is-expanded",
    !collapsed
  );

  $("#toggleFold").title=
    collapsed
      ? "Раскрыть общие строки"
      : "Схлопнуть общие строки";

  $("#toggleFold").setAttribute(
    "aria-label",
    $("#toggleFold").title
  );

  stage.scrollTop=scrollTop;
  stage.scrollLeft=scrollLeft;

  updateHistoryButtons();

  requestAnimationFrame(
    paintVirtualSelection
  );
}

function domOffsetFromPoint(
  element,
  x,
  y
){
  let node=null;
  let offset=0;

  if(document.caretPositionFromPoint){
    const position=
      document.caretPositionFromPoint(
        x,
        y
      );

    node=
      position?.offsetNode ||
      null;

    offset=
      position?.offset ||
      0;
  }else if(document.caretRangeFromPoint){
    const range=
      document.caretRangeFromPoint(
        x,
        y
      );

    node=
      range?.startContainer ||
      null;

    offset=
      range?.startOffset ||
      0;
  }

  if(
    !node ||
    !element.contains(node)
  ){
    const rect=
      element.getBoundingClientRect();

    return x<
      rect.left+rect.width/2
        ? 0
        : element.textContent.length;
  }

  try{
    const range=
      document.createRange();

    range.selectNodeContents(
      element
    );

    range.setEnd(
      node,
      offset
    );

    return range.toString().length;
  }catch{
    return 0;
  }
}

function offsetForBlockPoint(
  block,
  x,
  y
){
  const start=
    Number(block.dataset.start);

  const end=
    Number(block.dataset.end);

  if(end<=start){
    return start;
  }

  return Math.max(
    start,
    Math.min(
      end,
      start+
      domOffsetFromPoint(
        block,
        x,
        y
      )
    )
  );
}

function positionInTextNode(
  element,
  charOffset
){
  const walker=
    document.createTreeWalker(
      element,
      NodeFilter.SHOW_TEXT
    );

  let remaining=
    charOffset;

  let node;

  while(
    (node=walker.nextNode())
  ){
    const length=
      node.nodeValue.length;

    if(remaining<=length){
      return {
        node,
        offset:remaining
      };
    }

    remaining-=length;
  }

  return {
    node:element,
    offset:element.childNodes.length
  };
}

function rangeForBlockOffsets(
  block,
  start,
  end
){
  const first=
    positionInTextNode(
      block,
      start
    );

  const last=
    positionInTextNode(
      block,
      end
    );

  const range=
    document.createRange();

  try{
    range.setStart(
      first.node,
      first.offset
    );

    range.setEnd(
      last.node,
      last.offset
    );

    return range;
  }catch{
    return null;
  }
}

function clearHighlight(){
  if(window.CSS?.highlights){
    CSS.highlights.delete(
      "diff-selection"
    );
  }
}

function visibleBlocks(side){
  return [
    ...document.querySelectorAll(
      `.side[data-side="${side}"]`
    )
  ];
}

function findBlockForOffset(
  side,
  offset
){
  const blocks=
    visibleBlocks(side);

  let realAtStart=null;
  let realAtEnd=null;
  let realEmpty=null;
  let virtualFallback=null;

  for(const block of blocks){
    const start=
      Number(block.dataset.start);

    const end=
      Number(block.dataset.end);

    const real=
      block.dataset.realLine==="1";

    // Strongest case: caret is inside a real non-empty physical line.
    if(
      real &&
      start<=offset &&
      offset<end
    ){
      return block;
    }

    if(real){
      // A real empty final line (for a document ending in "\n") must
      // beat any virtual placeholders with the same offset.
      if(
        start===end &&
        offset===start
      ){
        realEmpty=block;
        continue;
      }

      // At the first character of a real line, prefer that line.
      if(
        offset===start &&
        end>start
      ){
        realAtStart=block;
        continue;
      }

      // At document/line end, keep the nearest real line as fallback.
      if(offset===end){
        realAtEnd=block;
      }

      continue;
    }

    // Virtual rows are alignment-only. They may receive a caret only
    // when no real physical source line represents this offset.
    if(
      start===end &&
      offset===start &&
      virtualFallback===null
    ){
      virtualFallback=block;
    }
  }

  return (
    realEmpty ||
    realAtStart ||
    realAtEnd ||
    virtualFallback
  );
}

function paintVirtualSelection(){
  clearHighlight();

  const caret=$("#virtualCaret");
  caret.style.display="none";

  if(!activeSide){
    return;
  }

  const editor=
    editorFor(activeSide);

  const start=
    editor.selectionStart ||
    0;

  const end=
    editor.selectionEnd ||
    0;

  const ranges=[];

  if(start!==end){
    for(
      const block of
      visibleBlocks(activeSide)
    ){
      const blockStart=
        Number(block.dataset.start);

      const blockEnd=
        Number(block.dataset.end);

      const from=
        Math.max(
          start,
          blockStart
        );

      const to=
        Math.min(
          end,
          blockEnd
        );

      if(to>from){
        const range=
          rangeForBlockOffsets(
            block,
            from-blockStart,
            to-blockStart
          );

        if(range){
          ranges.push(range);
        }
      }
    }

    if(
      window.Highlight &&
      window.CSS?.highlights
    ){
      CSS.highlights.set(
        "diff-selection",
        new Highlight(...ranges)
      );
    }

    return;
  }

  const block=
    findBlockForOffset(
      activeSide,
      start
    );

  if(!block){
    return;
  }

  const blockStart=
    Number(block.dataset.start);

  const blockEnd=
    Number(block.dataset.end);

  const local=
    Math.max(
      0,
      Math.min(
        start-blockStart,
        blockEnd-blockStart
      )
    );

  const range=
    rangeForBlockOffsets(
      block,
      local,
      local
    );

  let rect=
    range?.getBoundingClientRect();

  if(
    !rect ||
    (!rect.height && !rect.width)
  ){
    const blockRect=
      block.getBoundingClientRect();

    rect={
      left:blockRect.left+10,
      top:blockRect.top+4,
      height:19
    };
  }

  const stage=$("#diffStage");
  const stageRect=
    stage.getBoundingClientRect();

  caret.style.left=
    (
      rect.left-
      stageRect.left+
      stage.scrollLeft
    )+"px";

  caret.style.top=
    (
      rect.top-
      stageRect.top+
      stage.scrollTop
    )+"px";

  caret.style.height=
    Math.max(
      18,
      rect.height || 18
    )+"px";

  caret.style.display="block";
}

function isWordChar(char){
  return (
    !!char &&
    /[\p{L}\p{N}_]/u.test(char)
  );
}

function wordRangeAtOffset(
  text,
  offset
){
  offset=Math.max(
    0,
    Math.min(
      offset,
      text.length
    )
  );

  let probe=offset;

  if(
    (
      probe===text.length ||
      !isWordChar(text[probe])
    ) &&
    probe>0 &&
    isWordChar(text[probe-1])
  ){
    probe--;
  }

  if(!isWordChar(text[probe])){
    return {
      start:Math.min(
        offset,
        text.length
      ),
      end:Math.min(
        offset+1,
        text.length
      )
    };
  }

  let start=probe;
  let end=probe+1;

  while(
    start>0 &&
    isWordChar(text[start-1])
  ){
    start--;
  }

  while(
    end<text.length &&
    isWordChar(text[end])
  ){
    end++;
  }

  return {start,end};
}

function focusSide(
  side,
  offset,
  extend=false
){
  activeSide=side;

  const editor=
    editorFor(side);

  editor.focus({
    preventScroll:true
  });

  offset=Math.max(
    0,
    Math.min(
      offset,
      editor.value.length
    )
  );

  if(extend){
    const anchor=
      editor.selectionDirection===
      "backward"
        ? editor.selectionEnd
        : editor.selectionStart;

    if(offset<anchor){
      editor.setSelectionRange(
        offset,
        anchor,
        "backward"
      );
    }else{
      editor.setSelectionRange(
        anchor,
        offset,
        "forward"
      );
    }
  }else{
    editor.setSelectionRange(
      offset,
      offset
    );
  }

  paintVirtualSelection();
}

function selectWord(
  side,
  offset
){
  activeSide=side;

  const editor=
    editorFor(side);

  const range=
    wordRangeAtOffset(
      state[side],
      offset
    );

  editor.focus({
    preventScroll:true
  });

  editor.setSelectionRange(
    range.start,
    range.end,
    "forward"
  );

  paintVirtualSelection();
}

function blockAtPointForSide(
  side,
  x,
  y
){
  const direct=
    document
      .elementFromPoint(x,y)
      ?.closest?.(
        `.side[data-side="${side}"]`
      );

  if(direct){
    return direct;
  }

  const stageRect=
    $("#diffStage")
      .getBoundingClientRect();

  const probeX=
    side==="a"
      ? stageRect.left+
        Math.max(
          20,
          (stageRect.width-132)/4
        )
      : stageRect.right-
        Math.max(
          20,
          (stageRect.width-132)/4
        );

  return (
    document
      .elementFromPoint(
        probeX,
        y
      )
      ?.closest?.(
        `.side[data-side="${side}"]`
      ) ||
    null
  );
}

$("#diffStage").addEventListener(
  "pointerdown",
  event=>{
    let block=
      event.target.closest?.(
        ".side[data-side]"
      );

    if(!block){
      return;
    }

    event.preventDefault();

    const clientX=
      event.clientX;

    const clientY=
      event.clientY;

    if(renderDirty){
      render();

      block=
        document
          .elementFromPoint(
            clientX,
            clientY
          )
          ?.closest?.(
            ".side[data-side]"
          );

      if(!block){
        return;
      }
    }

    const side=
      block.dataset.side;

    const offset=
      offsetForBlockPoint(
        block,
        clientX,
        clientY
      );

    if(event.detail>=2){
      drag=null;
      selectWord(
        side,
        offset
      );
      return;
    }

    const editor=
      editorFor(side);

    if(
      event.shiftKey &&
      activeSide===side
    ){
      focusSide(
        side,
        offset,
        true
      );
    }else{
      focusSide(
        side,
        offset,
        false
      );
    }

    drag={
      side,
      anchor:
        event.shiftKey
          ? (
              editor.selectionDirection===
              "backward"
                ? editor.selectionEnd
                : editor.selectionStart
            )
          : offset,
      pointerId:event.pointerId
    };

    $("#diffStage")
      .setPointerCapture?.(
        event.pointerId
      );
  }
);

$("#diffStage").addEventListener(
  "pointermove",
  event=>{
    if(
      !drag ||
      drag.pointerId!==
      event.pointerId
    ){
      return;
    }

    event.preventDefault();

    const stage=$("#diffStage");
    const rect=
      stage.getBoundingClientRect();

    if(
      event.clientY<
      rect.top+18
    ){
      stage.scrollTop-=18;
    }else if(
      event.clientY>
      rect.bottom-18
    ){
      stage.scrollTop+=18;
    }

    const block=
      blockAtPointForSide(
        drag.side,
        event.clientX,
        Math.max(
          rect.top+2,
          Math.min(
            event.clientY,
            rect.bottom-2
          )
        )
      );

    if(!block){
      return;
    }

    const offset=
      offsetForBlockPoint(
        block,
        event.clientX,
        event.clientY
      );

    const editor=
      editorFor(drag.side);

    if(offset<drag.anchor){
      editor.setSelectionRange(
        offset,
        drag.anchor,
        "backward"
      );
    }else{
      editor.setSelectionRange(
        drag.anchor,
        offset,
        "forward"
      );
    }

    paintVirtualSelection();
  }
);

function endDrag(event){
  if(!drag){
    return;
  }

  if(
    event &&
    drag.pointerId!==
    event.pointerId
  ){
    return;
  }

  drag=null;
}

$("#diffStage")
  .addEventListener(
    "pointerup",
    endDrag
  );

$("#diffStage")
  .addEventListener(
    "pointercancel",
    endDrag
  );

for(const side of ["a","b"]){
  const editor=
    editorFor(side);

  editor.value=
    state[side];

  editor.addEventListener(
    "focus",
    ()=>{
      activeSide=side;
      paintVirtualSelection();
    }
  );

  editor.addEventListener(
    "select",
    paintVirtualSelection
  );

  editor.addEventListener(
    "keyup",
    paintVirtualSelection
  );

  editor.addEventListener(
    "click",
    paintVirtualSelection
  );

  editor.addEventListener(
    "beforeinput",
    event=>{
      if(
        event.inputType===
        "historyUndo" ||
        event.inputType===
        "historyRedo" ||
        !canWrite(side)
      ){
        return;
      }

      pushUndo(snapshot());
    }
  );

  editor.addEventListener(
    "input",
    ()=>{
      const oldText=
        state[side];

      const newText=
        editor.value
          .replace(
            /\r\n?/g,
            "\n"
          );

      state[side]=newText;

      const oldNewlines=
        (oldText.match(/\n/g) || [])
          .length;

      const newNewlines=
        (newText.match(/\n/g) || [])
          .length;

      if(
        oldNewlines!==
        newNewlines
      ){
        layoutDirty=true;
        renderDirty=true;
        scheduleRender(45);
        return;
      }

      if(layoutDirty){
        scheduleRender(45);
        return;
      }

      const patched=
        livePatchBlock(
          side,
          oldText,
          newText
        );

      if(patched){
        // Keep the active physical line plain while typing.
        // Re-highlighting it on every pause causes visible flashing
        // and can shift wrapping. We reconcile on blur/next click.
        cancelScheduledRender();
        return;
      }

      renderDirty=true;
      scheduleRender(70);
    }
  );

  editor.addEventListener(
    "blur",
    ()=>{
      if(renderDirty){
        requestAnimationFrame(
          render
        );
      }
    }
  );

  editor.addEventListener(
    "keydown",
    event=>{
      const mod=
        event.metaKey ||
        event.ctrlKey;

      if(
        mod &&
        !event.altKey
      ){
        const key=
          event.key.toLowerCase();

        if(key==="z"){
          event.preventDefault();
          event.shiftKey
            ? redo()
            : undo();
          return;
        }

        if(
          key==="y" &&
          !event.metaKey
        ){
          event.preventDefault();
          redo();
          return;
        }
      }

      requestAnimationFrame(
        paintVirtualSelection
      );
    }
  );
}

document.addEventListener(
  "selectionchange",
  ()=>{
    if(
      activeSide &&
      document.activeElement===
      editorFor(activeSide)
    ){
      paintVirtualSelection();
    }
  }
);

$("#swap").onclick = ()=>{
  if(!canWrite("a") || !canWrite("b")) return;

  const before = snapshot();

  [state.a,state.b] = [state.b,state.a];

  pushUndo(before);
  syncEditors(false);
  render();
};

$("#clear").onclick = ()=>{
  if(!canWrite("a") && !canWrite("b")) return;

  const before = snapshot();

  if(canWrite("a")) state.a = "";
  if(canWrite("b")) state.b = "";

  pushUndo(before);
  syncEditors(false);
  render();
};

$("#undo").onclick = undo;
$("#redo").onclick = redo;

$("#toggleFold").onclick = ()=>{
  collapsed = !collapsed;

  if(collapsed){
    foldReveal.clear();
  }

  render();
};

$("#algorithmSwitch").addEventListener("change",()=>{
  algorithmMode=
    $("#algorithmSwitch").checked
      ? "lines"
      : "myers";

  foldReveal.clear();
  render();
});

$("#readonlyA").onchange = ()=>{
  syncEditors();
  render();
};

$("#readonlyB").onchange = ()=>{
  syncEditors();
  render();
};

[
  "caseSoft",
  "punctSoft",
  "spaceSoft"
].forEach(id=>{
  $("#" + id).addEventListener("change",render);
});

async function writeClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return;
  }catch{}

  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";

  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  ta.remove();
}

document.querySelectorAll("[data-copy]").forEach(button=>{
  button.onclick = async ()=>{
    const side=
      button.dataset.copy;

    await writeClipboard(
      state[side]
    );

    button.classList.remove(
      "copy-ok"
    );

    void button.offsetWidth;

    button.classList.add(
      "copy-ok"
    );

    button.title="Скопировано";

    clearTimeout(
      button._copyTimer
    );

    button._copyTimer=
      setTimeout(()=>{
        button.classList.remove(
          "copy-ok"
        );

        button.title=
          side==="a"
            ? "Копировать текст A"
            : "Копировать текст B";
      },900);
  };
});

document.querySelectorAll(".icon-btn").forEach(button=>{
  button.addEventListener("click",()=>{
    button.classList.remove(
      "icon-pop"
    );

    void button.offsetWidth;

    button.classList.add(
      "icon-pop"
    );

    setTimeout(
      ()=>button.classList.remove(
        "icon-pop"
      ),
      300
    );
  });
});

$("#algorithmSwitch").checked=
  algorithmMode==="lines";

syncEditors(false);
render();
</script>
</body>
</html>
