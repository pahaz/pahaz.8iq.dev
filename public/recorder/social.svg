<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Рекордер для Mac — Встреча закончилась. Детали остались.</title>
<desc id="desc">Векторная версия рекламной карточки. Запись и расшифровка встреч на вашем Mac. Без облака, без бота и без аккаунта. Справа — иллюстративный интерфейс с волной звука и репликами участников. Это иллюстрация, а не снимок приложения.</desc>
