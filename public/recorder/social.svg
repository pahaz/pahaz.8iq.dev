  <linearGradient id="screen" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#d6dae0"/><stop offset="0.5" stop-color="#e8ebef"/><stop offset="1" stop-color="#b4bcc8"/></linearGradient>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#acb2bb"/><stop offset="0.18" stop-color="#dce0e5"/><stop offset="0.47" stop-color="#b9bec6"/><stop offset="0.73" stop-color="#6c737c"/><stop offset="1" stop-color="#30353c"/></linearGradient>
